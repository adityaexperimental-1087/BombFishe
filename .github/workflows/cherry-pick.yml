name: Cherry Pick Commit

on:
  workflow_dispatch:

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherry-pick commit
        run: |
          git checkout sixteenQPR2
          git cherry-pick 5d4518ff20f334b6d8389921e65fcb05a2266d6e || true

      - name: Push changes
        run: |
          git push origin sixteenQPR2
